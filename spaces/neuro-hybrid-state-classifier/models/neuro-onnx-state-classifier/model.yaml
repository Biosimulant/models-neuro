schema_version: "2.0"
title: "ONNX State Classifier"
description: "Runs a compact ONNX classifier over mechanistic neuron state features and emits class probabilities."
package: "Biosimulant/models-neuro:models/neuro-onnx-state-classifier/model.yaml"
version: "c4b2ade81a6f898c9a2a4e52d52e0fb9cfac4d9f"
standard: onnx
tags: [neuroscience, neuro, onnx, hybrid, classifier]
authors: ["Biosimulant Team"]
biosim:
  entrypoint: "src.state_classifier:OnnxStateClassifier"
  init_kwargs:
    model_path: "artifacts/linear_state_classifier.onnx"
io:
  inputs:
    - state_vector
  outputs:
    - state_probabilities
    - predicted_state
runtime:
  dependencies:
    packages:
      - numpy==2.3.3
      - onnxruntime==1.22.1
onnx:
  task: classification
  model_file: "artifacts/linear_state_classifier.onnx"
  inputs:
    - name: state_vector
      dtype: float32
      shape: [1, 4]
  outputs:
    - name: state_probabilities
      dtype: float32
      shape: [1, 3]
  class_labels: [quiescent, subthreshold, spiking]
